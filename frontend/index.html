<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moscovo</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="shell">
    <header class="hub-bar">
      <div class="hub-summary" id="hub-summary" title="Click or press / to edit Hub and nickname">
        <span class="status-dot" id="status-dot">●</span>
        <span class="hub-label" id="hub-addr-display">hub: 127.0.0.1:7878</span>
      </div>
      <span class="status-badge" id="status-badge">[OFFLINE]</span>
    </header>

    <form class="hub-editor hidden" id="hub-editor">
      <label class="field">
        <span>HUB</span>
        <input id="hub-input" type="text" autocomplete="off" spellcheck="false" placeholder="100.64.10.1:7878" />
      </label>
      <label class="field">
        <span>NICK</span>
        <input id="nick-input" type="text" autocomplete="off" spellcheck="false" placeholder="nickname" />
      </label>
      <div class="editor-actions">
        <button type="submit" class="btn btn-primary">[ENTER] APPLY</button>
        <button type="button" class="btn" id="cancel-edit-btn">[ESC] CANCEL</button>
      </div>
    </form>

    <div class="error-banner hidden" id="error-banner" role="alert"></div>

    <section class="device-bar" aria-label="Audio Devices">
      <div class="device-item" id="mic-device-row" title="Active Microphone">
        <span class="device-tag">IN</span>
        <span class="device-name" id="mic-device-name">Default Microphone</span>
      </div>
      <div class="device-item" id="out-device-row" title="Active Output Audio">
        <span class="device-tag">OUT</span>
        <span class="device-name" id="out-device-name">Default Output</span>
      </div>
    </section>

    <section class="screen-stage hidden" id="screen-stage" aria-label="Remote Screen Share">
      <div class="stage-bar">
        <span class="stage-title" id="stage-title">[LIVE] Screen</span>
        <div class="stage-actions">
          <button type="button" class="btn btn-mini" id="stage-expand-btn">[F] EXPAND</button>
          <button type="button" class="btn btn-mini" id="stage-hide-btn">[V] HIDE</button>
        </div>
      </div>
      <div class="stage-viewport">
        <canvas id="remote-screen-canvas"></canvas>
        <video id="remote-screen-video" autoplay playsinline muted></video>
      </div>
    </section>

    <section class="room-section" aria-label="Voice Room">
      <div class="section-title">
        <span>VOICE ROOM</span>
        <span id="room-meta"></span>
      </div>
      <div class="peer-list" id="peer-list"></div>
    </section>

    <footer class="controls">
      <div class="action-row">
        <button type="button" class="btn btn-primary" id="call-btn">[ENTER] JOIN</button>
        <button type="button" class="btn" id="mute-btn">[M] MIC: ON</button>
        <button type="button" class="btn" id="deafen-btn">[D] DEAFEN</button>
        <button type="button" class="btn btn-primary" id="ns-btn">[N] NS: RNNOISE</button>
        <button type="button" class="btn" id="share-btn">[S] SHARE</button>
      </div>
      <div class="hint-row">
        Space PTT · s share · v view · n noise · j/k select · h/l vol · x mute · / hub · Esc leave
      </div>
    </footer>

    <div class="share-modal hidden" id="share-modal" role="dialog" aria-modal="true" aria-label="Select Screen or Window">
      <div class="share-dialog">
        <div class="share-header">
          <span>SHARE SCREEN</span>
          <button type="button" class="btn btn-mini" id="share-refresh-btn">[R] REFRESH</button>
        </div>
        <div class="share-config-row">
          <label class="cfg-pill">
            <span>RES</span>
            <select id="share-res-select">
              <option value="720p">720p</option>
              <option value="1080p">1080p</option>
              <option value="native">Native</option>
            </select>
          </label>
          <label class="cfg-pill">
            <span>FPS</span>
            <select id="share-fps-select">
              <option value="15">15</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
            </select>
          </label>
          <label class="cfg-toggle">
            <input type="checkbox" id="share-audio-toggle" />
            <span>SYS AUDIO</span>
          </label>
        </div>
        <div class="share-source-list" id="share-source-list"></div>
        <div class="share-actions">
          <button type="button" class="btn btn-primary" id="share-confirm-btn">[ENTER] START SHARE</button>
          <button type="button" class="btn" id="share-cancel-btn">[ESC] CANCEL</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
